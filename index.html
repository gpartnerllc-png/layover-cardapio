    let currentCategory = 'all';

    function renderCategories() {
      document.getElementById('categories').innerHTML = categories.map(c => `
        <button onclick="setCategory('${c.id}')" 
          class="btn-3d px-4 py-2 text-xs whitespace-nowrap ${currentCategory === c.id ? 'bg-google-yellow text-slate-900' : 'bg-white text-slate-600 border border-slate-200'}">
          ${c.title}
        </button>
      `).join('');
    }

    function renderMenu(search = '') {
      const filtered = menuItems.filter(item => {
        const matchCat = currentCategory === 'all' || item.category_id === currentCategory;
        const matchSearch = item.name.toLowerCase().includes(search.toLowerCase()) || 
                           item.description.toLowerCase().includes(search.toLowerCase());
        return matchCat && matchSearch;
      });

      document.getElementById('menu-grid').innerHTML = filtered.map(item => `
        <div class="glass-card rounded-3xl overflow-hidden flex flex-col">
          <div class="relative h-44 overflow-hidden">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy" />
            <span class="absolute bottom-3 left-3 bg-white/95 text-google-green font-mono text-xs px-3 py-1 rounded-full font-bold shadow">
              R$ ${item.price.toFixed(2).replace('.', ',')}
            </span>
          </div>
          <div class="p-4 flex-1">
            <h3 class="font-bold text-slate-900">${item.name}</h3>
            <p class="text-xs text-slate-500 mt-1 leading-relaxed">${item.description}</p>
          </div>
        </div>
      `).join('') || '<p class="col-span-full text-center text-slate-400 py-16">Nenhum item encontrado.</p>';
    }

    function setCategory(id) {
      currentCategory = id;
      renderCategories();
      renderMenu(document.getElementById('search').value);
    }

    function filterMenu(value) {
      renderMenu(value);
    }

    // Init
    renderCategories();
    renderMenu();
    lucide.createIcons();
  </script>
